name: Cloudflare integrations checks
on:
  push:
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-check.yml"
  pull_request:
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-check.yml"
jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check cloudflare/src/index.mjs
      - run: node --test cloudflare/tests/*.test.mjs
