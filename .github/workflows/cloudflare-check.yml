name: Cloudflare integrations checks
on:
  push:
    paths:
      - "cloudflare/**"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-check.yml"
  pull_request:
    paths:
      - "cloudflare/**"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-check.yml"
jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check cloudflare/src/index.mjs
      - run: node --check cloudflare/public/statistics.mjs
      - run: node --check cloudflare/public/app.mjs
      - run: node --check cloudflare/public/likert-engine.mjs
      - run: node --check cloudflare/public/likert-ui.mjs
      - run: node --check cloudflare/public/likert-student.mjs
      - run: node --check cloudflare/public/workspace-ui.mjs
      - run: node --check cloudflare/public/value-labels.mjs
      - run: node --check cloudflare/public/likert-bulk.mjs
      - run: node --check cloudflare/public/business-analytics.mjs
      - run: node --check cloudflare/public/business-infographic.mjs
      - run: node --check cloudflare/public/business-ui.mjs
      - run: node --test cloudflare/tests/*.test.mjs
      - run: npx --yes wrangler deploy --dry-run --outdir /tmp/statlab-cloudflare-dist
