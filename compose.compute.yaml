# Local or private-host preparation ONLY; this file does not publish StatLab.
# Before starting, supply STATLAB_COMPUTE_SHARED_TOKEN in host environment (>=32 chars).
services:
  statlab-compute:
    build:
      context: .
      dockerfile: Dockerfile.compute
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      STATLAB_COMPUTE_SHARED_TOKEN: "${STATLAB_COMPUTE_SHARED_TOKEN:?Set a strong private service token before starting}"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    init: true
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
